 if(screen===2)$('overlay').innerHTML=`<div class="overlay"><section class="sheet" role="dialog" aria-label="시작하기"><div class="sheet-top"><h2>무엇을 할까요?</h2><button class="round" data-phone="1" aria-label="닫기">×</button></div><button data-phone="3"><strong>새 여행 만들기　↗</strong><small>누구와, 어디로, 어떤 분위기로.</small></button><button data-phone="7"><strong>릴스·쇼츠 가져오기　↗</strong><small>저장한 영상에서 다음 목적지 찾기</small></button><button data-phone="11"><strong>지금 이 순간 기록하기　↗</strong><small>사진 한 장으로 남기는 오늘</small></button></section></div>`;
 if(screen===3){html=wizard()+`<h2 class="title">어디로 갈까요?</h2><p class="description">아직 구체적이지 않아도 괜찮아요.</p><label class="field"><span>목적지</span><input data-field="destination" maxlength="35" value="${esc(draft.destination)}" placeholder="도시 또는 장소를 입력해 주세요"></label><div class="date-row"><label class="field"><span>출발</span><input type="date" data-field="date" value="${draft.date}"></label><label class="field"><span>종료 · 비워두면 미정</span><input type="date" data-field="end" value="${draft.end}"></label></div><div class="setting-row"><span><strong>이동 기록 켜기</strong><small>여행 중 경로를 남길 설정 · 예시</small></span><button class="switch ${draft.tracking?'on':''}" data-action="tracking" aria-label="이동 기록 설정" aria-pressed="${draft.tracking}"></button></div><div class="section-label">공개 범위</div>${segment(['나만','가족·친구','전체'],draft.privacy,'privacy')}`;action=primary('다음　→','next')}
 if(screen===4){html=wizard()+`<h2 class="title">누구와 함께 가나요?</h2><p class="description">함께하는 사람에 따라, 여행의 이야기도 달라져요.</p><div class="choice-list">${[['부모님','편한 이동, 추억을 나누는 이야기','♧'],['아이와 가족','쉬는 곳, 아이가 즐길 곳','✧'],['연인','서로의 취향을 발견하는 곳','♡'],['친구','함께 웃고 새로운 경험을','☼'],['혼자','오롯이 나의 속도로','⌁']].map(([name,desc,symbol])=>`<button class="choice ${draft.companions.includes(name)?'selected':''}" data-companion="${name}"><span class="symbol">${symbol}</span><span><strong>${name}</strong><small>${desc}</small></span><span class="tick">${draft.companions.includes(name)?'✓':''}</span></button>`).join('')}</div>`;action=primary('다음　→','next',!draft.companions.length)}
 if(screen===5){html=wizard()+`<h2 class="title">무엇에 끌리나요?</h2><p class="description">함께 발견하고 싶은 것들을<br>세 가지까지 골라 주세요.</p><div class="chips">${['지역 이야기','맛집','추억','역사','자연·바다','카페','사진 명소','전시·문화','시장','산책'].map(x=>`<button class="${draft.interests.includes(x)?'selected':''}" data-interest="${x}">${x}</button>`).join('')}</div><div class="selection-count">${draft.interests.length} / 3 선택</div>`;action=primary('다음　→','next',!draft.interests.length)}
 if(screen===6){html=wizard()+`<h2 class="title">이번 여행의 온도는?</h2><p class="description">이야기의 분위기와 하루의 속도를 골라요.</p><div class="choice-list">${[['잔잔한','여유 있게, 이야기는 깊게'],['활기찬','가볍고 즐겁게, 새로운 발견'],['감성적인','풍경과 추억을 오래 느끼며']].map(([x,desc])=>`<button class="choice ${draft.mood===x?'selected':''}" data-key="mood" data-value="${x}"><span><strong>${x}</strong><small>${desc}</small></span><span class="tick">${draft.mood===x?'✓':''}</span></button>`).join('')}</div><div class="section-label">일정 밀도</div>${segment(['느긋','보통','알차게'],draft.density,'density')}`;action=primary('다음　→','next')}
 if(screen===7){html=wizard()+`<h2 class="title">영상 속 그곳,<br>이번에 가 볼까요?</h2><p class="description">저장해 둔 취향을 여행으로 이어 봐요.<br>지금은 건너뛰어도 괜찮아요.</p><div class="import-list">${[['▶','유튜브 연결','좋아요·재생목록의 쇼츠'],['↗','공유로 보내기','릴스·쇼츠 공유 → 차곡'],['▤','인스타 내보내기 파일','저장함·좋아요 기록에서'],['⌁','유튜브 시청 기록 파일','Google 내보내기 파일']].map(([icon,name,desc])=>`<button class="import-item" data-import="${name}"><span class="import-icon">${icon}</span><span><strong>${name}</strong><small>${desc}</small></span><span class="tag">연동 전</span></button>`).join('')}</div><p class="hint">인스타 직접 계정 연결은 미지원이에요.<br>아래에서 샘플 장소로 흐름을 확인할 수 있어요.</p>`;action=primary('샘플 장소 찾아보기　→','recommend')+'<button class="text-button" data-phone="9">가져오기 건너뛰기</button>'}
 if(screen===8){html=`<div class="eyebrow">FROM YOUR SAVED MOMENTS</div><h2 class="title">마음에 담아 둔 곳.</h2><p class="description">영상 속 장소를 이번 여행에 담아 보세요.</p>${segment(['전체','저장','좋아요','보낸'],filter,'filter')}${places.filter(p=>filter==='전체'||filter===p.group).map(p=>`<button class="recommend-card ${selected.has(p.id)?'selected':''}" data-select="${p.id}"><h3>${p.name}</h3><span class="source">${p.source}</span><p>${p.reason}</p><span class="check">${selected.has(p.id)?'✓':'○'}</span></button>`).join('')}${saved.length?`<div class="section-label">차 안에서 새롭게 저장했어요</div>${saved.map(p=>`<div class="trip-card"><h2>${esc(p.name)}</h2><p>라디오에서 만난 장소</p></div>`).join('')}`:''}`;action=primary(`${selected.size}곳을 일정에 담기　→`,'add-itinerary',!selected.size)}
 if(screen===9){html=`<div class="eyebrow">${esc(draft.destination)} · ${esc(draft.date)}</div>${map(true)}<div class="schedule">${order.map((id,i)=>{const p=places.find(x=>x.id===id);return `<div class="schedule-row"><span class="number">${i+1}</span><span><strong>${p.name}</strong><small>${p.time} · ${p.stay} 머무르기</small></span><span class="reorder"><button data-move="${i}" data-direction="-1" ${i===0?'disabled':''} aria-label="${p.name} 위로">↑</button><button data-move="${i}" data-direction="1" ${i===order.length-1?'disabled':''} aria-label="${p.name} 아래로">↓</button></span></div>`}).join('')}</div><button class="discovery-link" data-phone="8"><span><strong>사이에 들를 곳 더 찾기</strong><small>우리 동선 근처의 작은 발견</small></span><span>＋</span></button><p class="hint">일정 시간과 경로는 예시예요.</p>`;action=primary('차로 보내기　↗','send-car')}
 if(screen===10){html=`<div class="eyebrow" style="margin-top:25px">ARRIVED · A LITTLE MEMORY</div><h2 class="title">방금의 순간을,<br>오래 간직하도록.</h2><div class="notification"><div class="brandline">≋　차곡 · 도착 알림 예시</div><h2>초당 순두부 거리에<br>도착했어요.</h2><p>이 장소의 사진 한 장을 남길까요?<br>오늘의 길 위에 기억이 하나 쌓여요.</p></div><button class="past" data-phone="12"><span class="past-art">${coast()}</span><span><strong>안목 커피거리</strong><small>앞서 남긴 기록 · 사진 3장 · 예시</small></span></button>`;action=primary('사진 남기기　＋','photos')+'<button class="text-button" data-phone="12">나중에 남길게요</button>'}
 if(screen===11){html=`<div class="eyebrow">초당 순두부 거리</div><h2 class="title">오늘을 닮은 사진.</h2><p class="description">기억하고 싶은 장면만 골라 주세요.</p>${segment(['제안','내 앨범','촬영'],photoTab,'photoTab')}${photoTab==='제안'?`<div class="photo-grid">${[1,2,3,4,5,6].map(n=>`<button class="photo-tile ${photos.has(n)?'selected':''}" data-photo="${n}" aria-label="샘플 사진 ${n}">${coast()}<span class="check">${photos.has(n)?'✓':''}</span><small>예시 ${n}</small></button>`).join('')}</div><p class="hint">예시 조건 · 이 장소 200m 안 · 12:20–13:40<br>실제 앨범·위치 정보를 읽지 않는 샘플 화면이에요.</p>`:'<p class="hint" style="padding:35px 0">앨범·촬영 기능은 연결 전이에요.<br>제안 탭에서 샘플 사진을 골라 볼 수 있어요.</p>'}`;if(photoTab==='제안')action=primary(`${photos.size}장 기록에 담기`,'save-photos',!photos.size)}
 if(screen===12){html=`<div class="eyebrow">${esc(draft.destination)} · ${esc(draft.date)}</div>${map(true)}<div class="timeline"><button class="timeline-row" data-phone="11"><strong>안목 커피거리</strong><small>10:32 · 사진 3 · 메모 1 · 예시</small></button><button class="timeline-row" data-phone="11"><strong>초당 순두부 거리</strong><small>12:34 · 선택한 사진 ${recorded.size}장</small></button><button class="timeline-row proposal" data-action="add-stop">${added?'✓　새로운 발자취를 기록했어요':'＋　새로 들른 곳을 기록으로 추가'}</button></div><p class="hint">지나온 길보다, 함께한 순간들을 기억해요.</p>`;action=primary('오늘의 여행 돌아보기　→','summary')}
 if(screen===13){html=`<div class="summary-hero"><div class="eyebrow">A DAY FULL OF LITTLE MOMENTS</div><h2>${esc(draft.destination)}, 우리의 하루.</h2><p>목적지 사이사이, 함께한 시간이<br>한 편의 여행이 되었어요.</p>${coast()}</div><div class="stats-grid"><div><b>214 <span style="font:11px sans-serif">km</span></b><small>함께 달린 거리</small></div><div><b>3</b><small>발견한 장소</small></div><div><b>${recorded.size||9}</b><small>남긴 사진 · 예시</small></div><div><b>2</b><small>들은 이야기</small></div></div><button class="export-row" data-action="video"><span><strong>여행 영상으로 다시 보기</strong><small>우리의 하루를 짧은 영상으로</small></span><span>↗</span></button><button class="export-row" data-action="book"><span><strong>한 권의 여행 책자</strong><small>경로 + 사진 + 메모 · 사진 5장부터</small></span><span>↗</span></button><p class="hint">공개 범위 · ${esc(draft.privacy)}<br>통계·사진은 예시이며 외부에 공유하지 않아요.</p>`}
 $('body').innerHTML=html;$('action').innerHTML=action?`<div class="bottom-action">${action}</div>`:'';
}
document.addEventListener('input',e=>{if(e.target.dataset.field)draft[e.target.dataset.field]=e.target.value});
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.phone){go(Number(b.dataset.phone));return}if(b.dataset.key){const k=b.dataset.key,v=b.dataset.value;if(k==='filter')filter=v;else if(k==='photoTab')photoTab=v;else draft[k]=v;render();return}if(b.dataset.companion){const x=b.dataset.companion;if(draft.companions.includes(x))draft.companions=draft.companions.filter(y=>y!==x);else{if(x==='혼자')draft.companions=[];else draft.companions=draft.companions.filter(y=>y!=='혼자');draft.companions.push(x)}render();return}if(b.dataset.interest){const x=b.dataset.interest;if(draft.interests.includes(x))draft.interests=draft.interests.filter(y=>y!==x);else if(draft.interests.length<3)draft.interests.push(x);else toast('관심사는 세 가지까지 골라 주세요.');render();return}if(b.dataset.import){toast(`${b.dataset.import}은 연결 전이에요. 샘플 추천으로 흐름을 확인해 주세요.`);return}if(b.dataset.select){selected.has(b.dataset.select)?selected.delete(b.dataset.select):selected.add(b.dataset.select);render();return}if(b.dataset.move!==undefined){const i=Number(b.dataset.move),j=i+Number(b.dataset.direction);if(j>=0&&j<order.length){[order[i],order[j]]=[order[j],order[i]];render()}return}if(b.dataset.photo){const n=Number(b.dataset.photo);photos.has(n)?photos.delete(n):photos.add(n);render();return}
switch(b.dataset.action){case'back':go(screen===3?2:screen-1);break;case'tracking':draft.tracking=!draft.tracking;render();break;case'next':if(screen===3&&(!draft.destination.trim()||!draft.date)){toast('목적지와 출발일을 입력해 주세요.');break}if(screen===3&&draft.end&&draft.end<draft.date){toast('종료일은 출발일 이후로 골라 주세요.');break}go(screen+1);break;case'recommend':go(8);break;case'add-itinerary':if(selected.size){order=[...selected];go(9)}break;case'send-car':send({type:'chagok-plan',plan:{destination:draft.destination,date:draft.date,companions:draft.companions.join(' · '),mood:draft.mood,places:order.map(id=>places.find(p=>p.id===id).name)}});toast('왼쪽 차량 화면에 예시 일정을 연결했어요. 실제 차량 전송은 아니에요.');break;case'photos':go(11);break;case'save-photos':photos.forEach(n=>recorded.add(n));go(12);break;case'add-stop':added=true;render();break;case'summary':go(13);break;case'video':toast('여행 영상 생성은 이후 연결할 기능이에요.');break;case'book':toast(recorded.size<5?'샘플 사진을 5장 이상 선택하면 책자 흐름을 이어갈 수 있어요.':'책자 생성은 이후 연결할 기능이에요.');break}});
window.addEventListener('message',e=>{if(e.source!==parent||e.origin!==location.origin)return;const d=e.data;if(d?.type==='chagok-phone-screen'&&Number.isInteger(d.screen)&&d.screen>=1&&d.screen<=13)go(d.screen,false);if(d?.type==='chagok-place-saved'&&d.place){if(!saved.some(p=>p.id===d.place.id))saved.push({id:String(d.place.id),name:String(d.place.name).slice(0,50)});if(screen===8)render()}});
render();send({type:'chagok-ready',group:'phone'});
</script></body></html>
